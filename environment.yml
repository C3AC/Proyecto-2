name: mosquito-ml
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas
  - numpy
  - matplotlib
  - seaborn
  - pillow
  - scikit-learn
  - jupyter
  - ipykernel
  - pip
  - pip:
      # PyTorch con CUDA (GTX 1650); el índice de pytorch.org trae las ruedas con GPU
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch
      - torchvision
      - timm
      - ultralytics
      - joblib
      - streamlit
      - plotly
